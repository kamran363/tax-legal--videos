name: FB Text Post (every 5h)

on:
  schedule:
    # Every 5 hours at :40, offset from videos+images: 02:40, 07:40, 12:40, 17:40, 22:40 UTC
    - cron: "40 6,14,22 * * *"
  workflow_dispatch:

jobs:
  post-text:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -q -r fb-auto2/requirements.txt

      - name: Post toddler text post
        env:
          PAGE_ID: "1266057776592265"
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python fb-auto2/fb_text_poster.py

      - name: Save posted list back to repo
        if: always()
        run: |
          git config user.name "fb-bot"
          git config user.email "fb-bot@local"
          git add fb-auto2/posted_text.json
          git diff --cached --quiet || git commit -m "mark posted text"
          git push
