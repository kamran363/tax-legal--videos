name: FB Video Test

on:
  workflow_dispatch:

jobs:
  test-video-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Upload to Facebook
        run: |
          curl -s -X POST "https://graph.facebook.com/v21.0/1266057776592265/videos" \
            -d "access_token=${{ secrets.FB_PAGE_TOKEN }}" \
            -d "file_url=https://muse.ai/files/1330173426844892/951203438032354/y4feafhdk4nqrj4x7w8a5lo4/toddler-test.mp4" \
            -d "title=Cute Toddler Moment!" \
            -d "description=Adorable toddler video test"
