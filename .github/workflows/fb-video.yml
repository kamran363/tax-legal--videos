name: FB Video Post (2x daily)


on:
  schedule:
    # 2x daily: 05:00 and 17:00 UTC (= 10:00 and 22:00 PKT)
    - cron: "0 3,5,9,15,17 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:
  post-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Download content zips from GitHub release
        run: |
          mkdir -p zips
          base="https://github.com/kamran363/tax-legal--videos/releases/download/v2.0"
          for i in 1 2 3 4 5; do curl -sSL -o "zips/cbc-real-$i.zip" "$base/cbc-real-$i.zip"; done
          ls -la zips/
          for z in zips/cbc-real-*.zip; do unzip -o -q "$z"; done
          echo "videos: $(ls fb-auto2/videos/*.mp4 | wc -l)"
          echo "script ok: $(ls fb-auto2/fb_video_poster.py)"


      - name: Install deps
        run: pip install -q requests


      - name: Post next baby clip
        env:
          PAGE_ID: "1266057776592265"
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python fb-auto2/fb_video_poster.py


      - name: Save posted list back to repo
        if: always()
        run: |
          git config user.name "fb-bot"
          git config user.email "fb-bot@local"
          git add fb-auto2/posted_videos.json
          git diff --cached --quiet || git commit -m "mark posted video"
          git push
